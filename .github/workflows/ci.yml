name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Smoke test the CLI
        run: |
          mcptw config examples/risky_config.json --format sarif -o risky.sarif || test $? -eq 1
          mcptw audit examples/demo_config.json || test $? -eq 1
          python -c "import json; assert json.load(open('risky.sarif'))['runs'][0]['results']"
